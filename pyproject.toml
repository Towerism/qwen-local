[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not machine' -p no:cacheprovider"
markers = [
    "machine: runs real tools on this machine (GPU, network or long builds); opt in with -m machine",
    "loopback: may connect to a test server on 127.0.0.1; every other connection is still refused",
]
